version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/cloudflare" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 12
      semver-patch-days: 7
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: 'wrangler'

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 12
      semver-patch-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "monthly"