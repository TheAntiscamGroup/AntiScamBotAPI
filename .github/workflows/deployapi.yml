name: Deploy API Project
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'cloudflare/**'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - '.github/**'

  workflow_dispatch:
    inputs:
        restart_bot:
            description: 'Restart API'
            required: true
            type: boolean

# Prevent multiple instances of this action from running at once
concurrency:
  group: "apideploy"
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions: write-all
    continue-on-error: true
    steps:
      - name: Cleanup Previous Deployments
        uses: strumwolf/delete-deployment-environment@a4825dd9648c57da8437a4885c3fcad58beac69c
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          onlyRemoveDeployments: true

  deploy:
    environment: production
    permissions:
      contents: read
    env:
      AUTHKEYNAME: ${{ vars.AUTH_KEY_NAME }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout files
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Dependency Update Check
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
      id: filter
      with:
        base: ${{ github.ref }}
        filters: |
          deps_update_needed:
            - 'requirements.txt'
            - '.runtime/update.sh'
          core_updated:
            - '**.py'

    # Adding the Private key to a Github Actions Workflow
    - name: Install SSH Key
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        log-public-key: false

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh/
        echo "$SSH_KEY" > ~/.ssh/staging.key
        chmod 600 ~/.ssh/staging.key
        cat >>~/.ssh/config <<END
        Host staging
          HostName $SSH_HOST
          User $SSH_USER
          IdentityFile ~/.ssh/staging.key
          StrictHostKeyChecking no
        END
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_KEY: ${{ secrets.SSH_KEY }}
        SSH_USER: ${{ secrets.SSH_USERNAME }}

      # If any runtime files updated, then we need to stop all bot instances.
    - name: Kill Running Instances
      id: kill_bot
      if: steps.filter.outputs.deps_update_needed == 'true' || steps.filter.outputs.core_updated == 'true' || inputs.restart_bot == 'true'
      run: ssh staging 'cd ~/project/AntiScamBotAPI && .runtime/kill.sh'

    # We want to update the project regardless.
    - name: Sync Project
      run: ssh staging 'cd ~/project/AntiScamBotAPI && ./update.sh'

    # attempt to update any python dependencies
    - name: Update Python Dependencies
      id: deps_update
      if: steps.filter.outputs.deps_update_needed == 'true'
      continue-on-error: false
      run: ssh staging 'set -e && cd ~/project/AntiScamBotAPI && .runtime/update.sh'

    # restart instances
    - name: Restart Instances
      if: ${{ always() && (steps.deps_update.conclusion == 'success' || steps.deps_update.outcome == 'skipped') && steps.kill_bot.conclusion == 'success' }}
      run: ssh staging 'set -e && cd ~/project/AntiScamBotAPI && nohup .runtime/run.sh &>/dev/null &'

    # Remove the key once done
    - name: Kill SSH Add
      run: rm -f ~/.ssh/staging.key